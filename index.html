  <script>

    const bwrPalette = [
      [0, 0, 0, 255],
      [255, 255, 255, 255],
      [255, 0, 0, 255]
    ]

    const bwPalette = [
      [0, 0, 0, 255],
      [255, 255, 255, 255],
    ]

    function rotateCanvas(degrees) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // 创建临时canvas
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');

      // 设置临时canvas尺寸
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;

      // 复制当前内容
      tempCtx.drawImage(canvas, 0, 0);

      // 清空原canvas
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 计算旋转后的尺寸
      if (Math.abs(degrees) === 90) {
        // 旋转90度需要交换宽高
        canvas.width = tempCanvas.height;
        canvas.height = tempCanvas.width;
      }

      // 旋转绘制
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(degrees * Math.PI / 180);
      ctx.translate(-tempCanvas.width / 2, -tempCanvas.height / 2);
      ctx.drawImage(tempCanvas, 0, 0);
      ctx.restore();

      // 重新应用抖动
      convert_dithering();

      console.log(`旋转 ${degrees} 度，新尺寸: ${canvas.width}x${canvas.height}`);
    }

    function dithering(ctx, width, height, thresholds, type) {
      const bayerThresholdMap = [
        [15, 135, 45, 165],
        [195, 75, 225, 105],
        [60, 180, 30, 150],
        [240, 120, 210, 90]
      ];

      const lumR = [];
      const lumG = [];
      const lumB = [];
      for (let i = 0; i < 256; i++) {
        lumR[i] = i * 0.299;
        lumG[i] = i * 0.587;
        lumB[i] = i * 0.114;
      }
      const imageData = ctx.getImageData(0, 0, width, height);

      const imageDataLength = imageData.data.length;

      // Greyscale luminance (sets r pixels to luminance of rgb)
      for (let i = 0; i <= imageDataLength; i += 4) {
        imageData.data[i] = Math.floor(lumR[imageData.data[i]] + lumG[imageData.data[i + 1]] + lumB[imageData.data[i + 2]]);
      }

      const w = imageData.width;
      let newPixel, err;

      for (let currentPixel = 0; currentPixel <= imageDataLength; currentPixel += 4) {

        if (type === "somegray") {
          imageData.data[currentPixel] = imageData.data[currentPixel] > thresholds[2] ? 255 : (imageData.data[currentPixel] > thresholds[1] ? 170 : (imageData.data[currentPixel] > thresholds[0] ? 85 : 0));
        } else if (type === "none") {
          // No dithering
          imageData.data[currentPixel] = imageData.data[currentPixel] < thresholds[0] ? 0 : 255;
        } else if (type === "bayer") {
          // 4x4 Bayer ordered dithering algorithm
          var x = currentPixel / 4 % w;
          var y = Math.floor(currentPixel / 4 / w);
          var map = Math.floor((imageData.data[currentPixel] + bayerThresholdMap[x % 4][y % 4]) / 2);
          imageData.data[currentPixel] = (map < thresholds[0]) ? 0 : 255;
        } else if (type === "floydsteinberg") {
          // Floyda€"Steinberg dithering algorithm
          newPixel = imageData.data[currentPixel] < 129 ? 0 : 255;
          err = Math.floor((imageData.data[currentPixel] - newPixel) / 16);
          imageData.data[currentPixel] = newPixel;

          imageData.data[currentPixel + 4] += err * 7;
          imageData.data[currentPixel + 4 * w - 4] += err * 3;
          imageData.data[currentPixel + 4 * w] += err * 5;
          imageData.data[currentPixel + 4 * w + 4] += err * 1;
        } else {
          // Bill Atkinson's dithering algorithm
          newPixel = imageData.data[currentPixel] < thresholds[0] ? 0 : 255;
          err = Math.floor((imageData.data[currentPixel] - newPixel) / 8);
          imageData.data[currentPixel] = newPixel;

          imageData.data[currentPixel + 4] += err;
          imageData.data[currentPixel + 8] += err;
          imageData.data[currentPixel + 4 * w - 4] += err;
          imageData.data[currentPixel + 4 * w] += err;
          imageData.data[currentPixel + 4 * w + 4] += err;
          imageData.data[currentPixel + 8 * w] += err;
        }

        // Set g and b pixels equal to r
        imageData.data[currentPixel + 1] = imageData.data[currentPixel + 2] = imageData.data[currentPixel];
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function canvas2bytes(canvas, type = 'bw', graysec = 0) {
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const arr = [];
      let buffer = [];

      for (let x = canvas.width - 1; x >= 0; x--) {
        for (let y = 0; y < canvas.height; y++) {
          const index = (canvas.width * 4 * y) + x * 4;
          if (type === 'bwr') {
            buffer.push(imageData.data[index] > 0 && imageData.data[index + 1] === 0 && imageData.data[index + 2] === 0 ? 1 : 0);
          } else if (type === "bw") {
            buffer.push(imageData.data[index] > 0 && imageData.data[index + 1] > 0 && imageData.data[index + 2] > 0 ? 1 : 0);
          } else if (type === "gray") {
            buffer.push(imageData.data[index] / 85 >= graysec ? 1 : 0);
          }

          if (buffer.length === 8) {
            arr.push(parseInt(buffer.join(''), 2));
            buffer = [];
          }
        }
      }
      return arr;
    }


    function canvas2bytes2(canvas, type = 'bw') {
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const arr = [];
      let buffer = [];

      for (let x = canvas.width - 1; x >= 0; x--) {
        for (let y = 0; y < canvas.height; y++) {
          const index = (canvas.width * 4 * y) + x * 4;

          if (type !== 'red') {
            buffer.push(imageData.data[index] === 0 && imageData.data[index + 1] === 0 && imageData.data[index + 2] === 0 ? 0 : 1);
          } else {
            buffer.push(imageData.data[index] > 0 && imageData.data[index + 1] === 0 && imageData.data[index + 2] === 0 ? 0 : 1);
          }

          if (buffer.length === 8) {
            arr.push(parseInt(buffer.join(''), 2));
            buffer = [];
          }
        }
      }
      return arr;
    }
    /**
     * UC8159 画布转字节数据
     * 每个像素用2位表示：10=红色，01=黑色，00=白色
     * 每4个像素（8位）打包成一个字节
     * 
     * @param {HTMLCanvasElement} canvas - 画布对象
     * @param {string} type - 'bwr' 三色打包（默认），'bw' 黑白数据，'red' 红色数据
     * @returns {number[]|Object} 字节数组或包含黑白红数据的对象
     */
    function canvas2bytes_uc8159(canvas, type = 'bwr') {
      const w = canvas.width;
      const h = canvas.height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, w, h);
      const pix = imgData.data;

      // 如果只需要黑白数据或红色数据（兼容模式）
      if (type === 'bw' || type === 'red') {
        const buf = [];
        let bitBuffer = [];

        for (let x = w - 1; x >= 0; x--) {
          for (let y = 0; y < h; y++) {
            const idx = (w * 4 * y) + x * 4;
            const r = pix[idx];
            const g = pix[idx + 1];
            const b = pix[idx + 2];

            const gray = r * 0.299 + g * 0.587 + b * 0.114;
            const isBlack = gray < 128;
            const isRed = isRedPixel(r, g, b);

            let bit;
            if (type === 'bw') {
              bit = isBlack ? 1 : 0;
            } else { // red
              bit = isRed ? 1 : 0;
            }

            bitBuffer.push(bit);

            if (bitBuffer.length === 8) {
              buf.push(parseInt(bitBuffer.join(''), 2));
              bitBuffer = [];
            }
          }
        }

        if (bitBuffer.length > 0) {
          while (bitBuffer.length < 8) bitBuffer.push(0);
          buf.push(parseInt(bitBuffer.join(''), 2));
        }

        return buf;
      }

      // 三色打包模式（默认）
      const outputBuf = [];
      let bitBuffer = [];

      // X从右向左，Y从上到下
      for (let x = w - 1; x >= 0; x--) {
        for (let y = 0; y < h; y++) {
          const idx = (w * 4 * y) + x * 4;
          const r = pix[idx];
          const g = pix[idx + 1];
          const b = pix[idx + 2];

          // 颜色判断
          const gray = r * 0.299 + g * 0.587 + b * 0.114;
          const isBlack = gray < 128;
          const isRed = isRedPixel(r, g, b);

          let bits;
          if (isRed) {
            bits = ['1', '0']; // 红色 = 10
          } else if (isBlack) {
            bits = ['0', '1']; // 黑色 = 01
          } else {
            bits = ['0', '0']; // 白色 = 00
          }

          bitBuffer.push(...bits);

          // 满8bit打包一字节（4个像素）
          if (bitBuffer.length === 8) {
            outputBuf.push(parseInt(bitBuffer.join(''), 2));
            bitBuffer = [];
          }
        }
      }

      // 末尾不足8bit补0
      if (bitBuffer.length > 0) {
        while (bitBuffer.length < 8) bitBuffer.push('0');
        outputBuf.push(parseInt(bitBuffer.join(''), 2));
      }

      return outputBuf;
    }

    /**
     * 判断是否为红色像素（增强版）
     * @param {number} r - 红色分量
     * @param {number} g - 绿色分量  
     * @param {number} b - 蓝色分量
     * @param {Object} options - 可选参数
     * @returns {boolean}
     */
    function isRedPixel(r, g, b, options = {}) {
      // 默认阈值
      const thresholds = {
        redMin: options.redMin || 140,
        greenMax: options.greenMax || 100,
        blueMax: options.blueMax || 100,
        diffMin: options.diffMin || 30,
        excludeBlack: options.excludeBlack !== undefined ? options.excludeBlack : true
      };

      // 排除黑色
      if (thresholds.excludeBlack && r < 50 && g < 50 && b < 50) {
        return false;
      }

      // 红色判定：红色分量高，绿蓝分量低，且红色明显大于绿蓝
      return (r > thresholds.redMin &&
        g < thresholds.greenMax &&
        b < thresholds.blueMax &&
        r > g + thresholds.diffMin &&
        r > b + thresholds.diffMin);
    }



    function getColorDistance(rgba1, rgba2) {
      const [r1, b1, g1] = rgba1;
      const [r2, b2, g2] = rgba2;

      const rm = (r1 + r2) / 2;

      const r = r1 - r2;
      const g = g1 - g2;
      const b = b1 - b2;

      return Math.sqrt((2 + rm / 256) * r * r + 4 * g * g + (2 + (255 - rm) / 256) * b * b);
    }

    function getNearColor(pixel, palette) {
      let minDistance = 255 * 255 * 3 + 1;
      let paletteIndex = 0;

      for (let i = 0; i < palette.length; i++) {
        const targetColor = palette[i];
        const distance = getColorDistance(pixel, targetColor);
        if (distance < minDistance) {
          minDistance = distance;
          paletteIndex = i;
        }
      }

      return palette[paletteIndex];
    }


    function getNearColorV2(color, palette) {
      let minDistanceSquared = 255 * 255 + 255 * 255 + 255 * 255 + 1;

      let bestIndex = 0;
      for (let i = 0; i < palette.length; i++) {
        let rdiff = (color[0] & 0xff) - (palette[i][0] & 0xff);
        let gdiff = (color[1] & 0xff) - (palette[i][1] & 0xff);
        let bdiff = (color[2] & 0xff) - (palette[i][2] & 0xff);
        let distanceSquared = rdiff * rdiff + gdiff * gdiff + bdiff * bdiff;
        if (distanceSquared < minDistanceSquared) {
          minDistanceSquared = distanceSquared;
          bestIndex = i;
        }
      }
      return palette[bestIndex];

    }


    function updatePixel(imageData, index, color) {
      imageData[index] = color[0];
      imageData[index + 1] = color[1];
      imageData[index + 2] = color[2];
      imageData[index + 3] = color[3];
    }

    function getColorErr(color1, color2, rate) {
      const res = [];
      for (let i = 0; i < 3; i++) {
        res.push(Math.floor((color1[i] - color2[i]) / rate));
      }
      return res;
    }

    function updatePixelErr(imageData, index, err, rate) {
      imageData[index] += err[0] * rate;
      imageData[index + 1] += err[1] * rate;
      imageData[index + 2] += err[2] * rate;
    }

    function ditheringCanvasByPalette(canvas, palette, type) {
      palette = palette || bwrPalette;

      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const w = imageData.width;

      for (let currentPixel = 0; currentPixel <= imageData.data.length; currentPixel += 4) {
        const newColor = getNearColorV2(imageData.data.slice(currentPixel, currentPixel + 4), palette);

        if (type === "bwr_floydsteinberg") {
          const err = getColorErr(imageData.data.slice(currentPixel, currentPixel + 4), newColor, 16);

          updatePixel(imageData.data, currentPixel, newColor);
          updatePixelErr(imageData.data, currentPixel + 4, err, 7);
          updatePixelErr(imageData.data, currentPixel + 4 * w - 4, err, 3);
          updatePixelErr(imageData.data, currentPixel + 4 * w, err, 5);
          updatePixelErr(imageData.data, currentPixel + 4 * w + 4, err, 1);
        } else {
          const err = getColorErr(imageData.data.slice(currentPixel, currentPixel + 4), newColor, 8);

          updatePixel(imageData.data, currentPixel, newColor);
          updatePixelErr(imageData.data, currentPixel + 4, err, 1);
          updatePixelErr(imageData.data, currentPixel + 8, err, 1);
          updatePixelErr(imageData.data, currentPixel + 4 * w - 4, err, 1);
          updatePixelErr(imageData.data, currentPixel + 4 * w, err, 1);
          updatePixelErr(imageData.data, currentPixel + 4 * w + 4, err, 1);
          updatePixelErr(imageData.data, currentPixel + 8 * w, err, 1);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function hexToBytes(hex) {
      for (var bytes = [], c = 0; c < hex.length; c += 2)
        bytes.push(parseInt(hex.substr(c, 2), 16));
      return new Uint8Array(bytes);
    }

    function bytesToHex(data) {
      return new Uint8Array(data).reduce(
        function (memo, i) {
          return memo + ("0" + i.toString(16)).slice(-2);
        }, "");
    }

    function intToHex(intIn, bytes = 4) {
      return intIn.toString(16).padStart(bytes * 2, '0');
    }

  <script>
    let bleDevice;
    let gattServer;
    let Theservice;
    let epdService;
    let epochCharacter;

    async function sleep(ms) {
      await new Promise(resolve => setTimeout(resolve, ms));
    }

    async function doConnect() {
      if (gattServer != null && gattServer.connected) {
        if (bleDevice != null && bleDevice.gatt.connected)
          bleDevice.gatt.disconnect();
      }
      else {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: ['C26_'] }],
          optionalServices: [
            0xfff0,
          ],
          //acceptAllDevices: true 
        });
        saveLastDevice(bleDevice);
        updateLastDeviceUI();
        bleDevice.addEventListener('gattserverdisconnected', disconnect);
        await connect();
      }
    }

    /**
     * 重连保存的设备
     * 从 localStorage 读取上次连接的设备信息并尝试重连
     */
    async function doReconnect() {
      // 如果已经连接，先断开
      if (gattServer != null && gattServer.connected) {
        if (bleDevice != null && bleDevice.gatt.connected) {
          info('已连接，先断开...');
          bleDevice.gatt.disconnect();
          await sleep(1000);
        }
      }

      try {
        const savedDeviceId = localStorage.getItem('lastBleDeviceId');
        const savedDeviceName = localStorage.getItem('lastBleDeviceName');
        
        if (!savedDeviceId) {
          info('没有保存的设备，请先点击 Connect 连接');
          alert('没有保存的设备，请先点击 Connect 连接');
          return;
        }

        info(`尝试重连设备: ${savedDeviceName || savedDeviceId}`);

        // Web Bluetooth API 不支持直接通过 deviceId 重连
        // 使用名称前缀过滤，让用户选择设备
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: ['C26_'] }],
          optionalServices: [0xfff0],
        });

        // 检查是否匹配保存的设备
        if (bleDevice.id !== savedDeviceId) {
          info(`⚠️ 警告: 连接的不是上次的设备`);
          info(`   上次: ${savedDeviceName || savedDeviceId}`);
          info(`   当前: ${bleDevice.name || bleDevice.id}`);
          
          // 询问用户是否继续
          const continueConnect = confirm(
            `检测到连接的不是上次使用的设备！\n\n` +
            `上次设备: ${savedDeviceName || savedDeviceId}\n` +
            `当前设备: ${bleDevice.name || bleDevice.id}\n\n` +
            `是否继续连接当前设备？`
          );
          
          if (!continueConnect) {
            info('重连已取消');
            return;
          }
        }

        bleDevice.addEventListener('gattserverdisconnected', disconnect);
        await connect();
        info(`✅ 重连成功: ${bleDevice.name || bleDevice.id}`);
        
        // 更新保存的设备信息
        saveLastDevice(bleDevice);
        updateLastDeviceUI();
        
        // 更新按钮状态
        document.getElementById('btnReconnect').disabled = true;
        
      } catch (error) {
        console.error('重连失败:', error);
        info(`❌ 重连失败: ${error.message}`);
        
        if (error.message.includes('cancelled') || error.message.includes('cancel')) {
          info('用户取消了选择');
        } else if (error.message.includes('Bluetooth') || error.message.includes('device')) {
          alert('重连失败，请确保:\n1. 蓝牙已开启\n2. 设备在附近\n3. 设备未连接其他设备\n\n然后点击 Connect 手动连接');
        } else {
          alert(`重连失败: ${error.message}`);
        }
        
        // 启用重连按钮，允许用户重试
        document.getElementById('btnReconnect').disabled = false;
      }
    }

    function saveLastDevice(device) {
      if (!device) return;
      try {
        localStorage.setItem('lastBleDeviceId', device.id);
        const nameToSave = device.name || device.id || 'Unknown';
        localStorage.setItem('lastBleDeviceName', nameToSave);
      } catch (e) {
        console.warn('localStorage 保存失败', e);
      }
    }

    function updateLastDeviceUI() {
      const lastName = localStorage.getItem('lastBleDeviceName');
      const btn = document.getElementById('btnReconnect');
      const label = document.getElementById('lastDeviceLabel');
      const connected = (gattServer && gattServer.connected) || (bleDevice && bleDevice.gatt && bleDevice.gatt.connected);
      
      if (lastName) {
        label.textContent = `📱 上次设备: ${lastName}`;
        btn.disabled = !!connected;
        btn.title = connected ? '已连接' : '点击重连上次的设备';
      } else {
        btn.disabled = true;
        label.textContent = '📱 未保存设备';
        btn.title = '请先连接设备';
      }
    }


    async function connect() {
      if (epochCharacter == null) {
        info("Connect to " + bleDevice.name)
        gattServer = await bleDevice.gatt.connect();
        info('> Found GATT server');
        epdService = await gattServer.getPrimaryService(0xfff0);
        info('> Found EPD service');
        epochCharacter = await epdService.getCharacteristic(0xfff1);
        document.getElementById("btnConnect").innerHTML = 'Disconnect';
        etagFnEnable(true);//document.getElementById('etagFn').style.visibility = '';
        saveLastDevice(bleDevice);
        updateLastDeviceUI();
      }
    }

    function disconnect() {
      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      gattServer = null;
      epdService = null;
      epochCharacter = null;
      info('Disconnected.');

      document.getElementById("btnConnect").innerHTML = 'Connect';
      document.getElementById("btnReconnect").disabled = false;
      etagFnEnable(false);//document.getElementById('etagFn').style.visibility = 'hidden';
      
      // 更新UI状态
      updateLastDeviceUI();
    }

    window.addEventListener('load', () => {
      updateLastDeviceUI();
    });

    async function doSetTime() {
      var epoch = Date.now() / 1000 | 0;
      var buf = new ArrayBuffer(4);
      var arr = new Uint32Array(buf);
      arr[0] = epoch;
      await epochCharacter.writeValueWithResponse(arr);
      info("Write unix epoch: " + epoch);
    }

    /**
     * 手动设置时间 - 弹出日期时间选择器
     * 用户可以选择具体日期和时间，然后同步到设备
     */
    async function doSetTimeManual() {
      // 获取当前时间作为默认值
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const defaultDateTime = `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;

      // 弹出日期时间选择器
      const dateTimeStr = prompt(
        '请输入日期和时间 (格式: YYYY-MM-DDTHH:MM:SS)\n' +
        '例如: 2026-07-18T14:30:00',
        defaultDateTime
      );

      if (dateTimeStr === null) {
        info('手动设置时间已取消');
        return;
      }

      // 解析用户输入
      const trimmed = dateTimeStr.trim();
      if (!trimmed) {
        alert('请输入有效的日期时间');
        return;
      }

      // 尝试解析日期
      const dateObj = new Date(trimmed);
      if (isNaN(dateObj.getTime())) {
        alert('无效的日期时间格式，请使用格式: YYYY-MM-DDTHH:MM:SS');
        return;
      }

      // 计算 Unix 时间戳（秒）
      const epoch = Math.floor(dateObj.getTime() / 1000);
      
      // 验证时间戳是否合理（1970-2038年之间）
      if (epoch < 0 || epoch > 2147483647) {
        alert('时间超出有效范围 (1970-2038)');
        return;
      }

      try {
        // 发送时间到设备
        var buf = new ArrayBuffer(4);
        var arr = new Uint32Array(buf);
        arr[0] = epoch;
        await epochCharacter.writeValueWithResponse(arr);
        
        const dateStr = dateObj.toLocaleString('zh-CN');
        info(`✅ 手动设置时间成功: ${dateStr} (Unix: ${epoch})`);
        alert(`时间设置成功！\n${dateStr}`);

    async function doCmd(cmd, data) {
      const epdCmd = {
        EPD_CMD_CLR: 1,
        EPD_CMD_MODE: 2,
        EPD_CMD_BUF: 3,
        EPD_CMD_BUF_CONT: 4,
        EPD_CMD_LUT: 5,
        EPD_CMD_RST: 6,
        EPD_CMD_BW: 7,
        EPD_CMD_RED: 8,
        EPD_CMD_DP: 9,
        EPD_CMD_FILL: 10,

        EPD_CMD_BUF_PUT: 11,
        EPD_CMD_BUF_GET: 12,
        EPD_CMD_SNV_WRITE: 13,
        EPD_CMD_SNV_READ: 14,

        EPD_CMD_SAVE_CFG: 15,
        // EPD_CMD_SNV_READPASSID: 16,
      };

      var chr = await epdService.getCharacteristic(0xfffe);
      switch (cmd) {
        case 'read': {
          var data = await chr.readValue();
          return data;
        }

        case 'clr':
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_CLR]));
          break;

        case 'mode':
          // await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_MODE, data == 'image'?0x01:0x00]));
          // 扩展mode指令：时钟=0x00、图片=0x01、日历=0x02
          let modeVal = 0x00; // 默认时钟模式
          if (data === 'image') {
            modeVal = 0x01;
          } else if (data === 'calendar') { // 新增日历模式指令值
            modeVal = 0x02;
          }
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_MODE, modeVal]));
          break;
        case 'buf':
          for (var i = 0; i < data.length; i += 60) {
            let arr = [(i == 0 ? epdCmd.EPD_CMD_BUF : epdCmd.EPD_CMD_BUF_CONT)];
            arr.push(...data.slice(i, i + 60));
            //console.log(arr);
            await chr.writeValueWithResponse(Uint8Array.from(arr));
            //  info(`> buf at ${i} size ${arr.length}`)
          }
          break;

        case 'lut':
          let arr = [epdCmd.EPD_CMD_LUT];
          arr.push(...data);
          await chr.writeValueWithResponse(Uint8Array.from(arr));
          break;

        case 'rst':
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_RST]));
          break;

        case 'bw':
          // write to bw ram
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_BW]));
          break;

        case 'red':
          // write to bw ram
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_RED]));
          break;

        case 'fill':
          // fill ram with black(0) or red(1)
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_FILL, data == 'red' ? 0x01 : 0x00]));
          break;

        case 'dp':
          // show
          let lut = 0;
          switch (data) {
            case 'gray8':
              lut = 2;
              break;
            case 'user':
              lut = 0xff;
              break;
            case 'full':
            default:
              lut = 0;
          }
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_DP, lut]));
          break;

        case 'snv_read':
          // SNV index, read length
          console.log(`snv read ${data}`);
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_SNV_READ, ...data]));
          break;

        case 'snv_write':
          // SNV index
          console.log(`snv write ${data}`);
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_SNV_WRITE, data]));
          break;

        case 'buf_get':
          // buffer index
          console.log(`buf get ${data}`);
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_BUF_GET, data]));
          break;

        case 'buf_put':
          // buffer index, data ...
          console.log(`buf put ${data}`);
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_BUF_PUT, ...data]));
          break;

        case 'save_cfg':
          await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_SAVE_CFG]));
          break;
        // case 'read_passid':
        //   await chr.writeValueWithResponse(Uint8Array.from([epdCmd.EPD_CMD_READPASSID]));

        // break;


      }
      info(`> epdCmd.${cmd}`)
    }

    async function doCmdRead(snvId, size) {
      var out = [];

      // request SNV read
      await doCmd('snv_read', [snvId, size]);

      // pull data
      for (var i = 0; i < size;) {
        await doCmd('buf_get', i);
        var data = new Uint8Array((await doCmd('read')).buffer);
        if (data.byteLength == 0) {
          break;
        }
        // first byte is the data index 
        i += data.byteLength - 1;

        // add data to out, except the first byte.
        out.push(...data.slice(1));
      }
      return out;
    }

    function canvas2bytes(canvas, type = 'bw') {
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const arr = [];
      let buffer = [];

      for (let y = 0; y < canvas.height; y += 8) {
        for (let x = 0; x < canvas.width; x++) {
          for (let a = 0; a < 8; a++) {
            const i = (canvas.width * (y + a) + x) * 4;
            if (type !== 'red') {
              // 1 for white, 0 for black
              // black : 0, 0, 0
              buffer.push(imageData.data[i] === 0 && imageData.data[i + 1] === 0 && imageData.data[i + 2] === 0 ? 0 : 1);
            } else {
              // 1 for red, 0 for white
              buffer.push(imageData.data[i] > 0 && imageData.data[i + 1] === 0 && imageData.data[i + 2] === 0 ? 1 : 0);
            }
          }
          arr.push(parseInt(buffer.join(''), 2));
          buffer = [];
        }
      }
      console.log(arr);
      return arr;
    }

    function canvas2grey8(canvas, type = 'bw') {
      // each px = 4bit black + 4bit red.
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const arr = [];
      let buffer = [];

      for (let y = 0; y < canvas.height; y += 8) {
        for (let x = 0; x < canvas.width; x++) {
          for (let a = 0; a < 8; a++) {
            const i = (canvas.width * (y + a) + x) * 4;
            const R = imageData.data[i];
            const G = imageData.data[i + 1];
            const B = imageData.data[i + 2];

            let grey = 0;  // white
            if (R == 255 && G != 255 && B != 255) { // red
              grey = (type == 'bw') ? 0 : (510 + 62 - G - B) >> 6;
            } else { // gray
              grey = (type == 'bw') ? (255 + 31 - R) >> 5 : 0;
            }
            arr.push(grey);
          }
        }
      }
      return arr;
    }

            ctx.translate(screenWidth / 2, screenHeight / 2);

            // 旋转90度（顺时针）
            ctx.rotate(90 * Math.PI / 180);

            // 在旋转后的坐标系中绘制
            const drawX = -drawWidth / 2;
            const drawY = -drawHeight / 2;

            ctx.drawImage(
              image,
              0, 0, sourceWidth, sourceHeight,
              drawX, drawY, drawWidth, drawHeight
            );

            ctx.restore();

            console.log('旋转绘制完成');
          } else if (needRotation && !imageIsLandscape) {
            // 竖屏图片在横屏上显示
            console.log('竖屏图片在横屏上显示，旋转-90度');

            const sourceWidth = image.width;
            const sourceHeight = image.height;
            const rotatedWidth = sourceHeight;
            const rotatedHeight = sourceWidth;

            // 计算缩放
            const scaleForWidth = screenWidth / rotatedWidth;
            const resultingHeight1 = rotatedHeight * scaleForWidth;

            const scaleForHeight = screenHeight / rotatedHeight;
            const resultingWidth2 = rotatedWidth * scaleForHeight;

            let scale;
            if (resultingHeight1 <= screenHeight) {
              scale = scaleForWidth;
            } else {
              scale = scaleForHeight;
            }

            const actualWidth = rotatedWidth * scale;
            const actualHeight = rotatedHeight * scale;

            // 旋转-90度绘制
            ctx.save();
            ctx.translate(screenWidth / 2, screenHeight / 2);
            ctx.rotate(-90 * Math.PI / 180);

            const drawX = -actualWidth / 2;
            const drawY = -actualHeight / 2;

            ctx.drawImage(
              image,
              0, 0, sourceWidth, sourceHeight,
              drawX, drawY, actualWidth, actualHeight
            );

            ctx.restore();

          } else {
            // 不需要旋转
            console.log('方向匹配，直接缩放');

            const scale = Math.min(
              screenWidth / image.width,
              screenHeight / image.height
            );

            const drawWidth = image.width * scale;
            const drawHeight = image.height * scale;
            const offsetX = (screenWidth - drawWidth) / 2;
            const offsetY = (screenHeight - drawHeight) / 2;

            console.log(`缩放: ${scale.toFixed(4)}, 尺寸: ${drawWidth.toFixed(0)}x${drawHeight.toFixed(0)}`);
            console.log(`居中: x=${offsetX.toFixed(0)}, y=${offsetY.toFixed(0)}`);

            ctx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);
          }

          console.log('预览完成，应用抖动算法...');
          convert_dithering();
        };

        image.onerror = function (e) {
          console.error('图片加载失败:', e);
          alert('图片加载失败，请检查图片格式');
        };
      }
    }

    function get_position(canvas, x, y) {
      let rect = canvas.getBoundingClientRect()
      return {
        x: x - rect.left * (canvas.width / rect.width),
        y: y - rect.top * (canvas.height / rect.height)
      }
    }

    function clear_canvas() {
      if (confirm('确认清除屏幕?')) {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function horizon_clip_canvas() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext("2d");
      const sourceData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var newData = ctx.createImageData(canvas.width, canvas.height);
      for (var i = 0, h = sourceData.height; i < h; i++) {
        for (j = 0, w = sourceData.width; j < w; j++) {
          newData.data[i * w * 4 + j * 4 + 0] =
            sourceData.data[i * w * 4 + (w - j) * 4 + 0];
          newData.data[i * w * 4 + j * 4 + 1] =
            sourceData.data[i * w * 4 + (w - j) * 4 + 1];
          newData.data[i * w * 4 + j * 4 + 2] =
            sourceData.data[i * w * 4 + (w - j) * 4 + 2];
          newData.data[i * w * 4 + j * 4 + 3] =
            sourceData.data[i * w * 4 + (w - j) * 4 + 3];
        }
      }
      ctx.putImageData(newData, 0, 0);
    }

    function vertial_clip_canvas() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext("2d");
      const sourceData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var newData = ctx.createImageData(canvas.width, canvas.height);
      for (var i = 0, h = sourceData.height; i < h; i++) {
        for (var j = 0, w = sourceData.width; j < w; j++) {
          newData.data[i * w * 4 + j * 4 + 0] =
            sourceData.data[(h - i) * w * 4 + j * 4 + 0];
          newData.data[i * w * 4 + j * 4 + 1] =
            sourceData.data[(h - i) * w * 4 + j * 4 + 1];
          newData.data[i * w * 4 + j * 4 + 2] =
            sourceData.data[(h - i) * w * 4 + j * 4 + 2];
          newData.data[i * w * 4 + j * 4 + 3] =
            sourceData.data[(h - i) * w * 4 + j * 4 + 3];
        }
      }
      ctx.putImageData(newData, 0, 0);
    }

    function convert_dithering() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext("2d");
      const mode = document.getElementById('dithering').value;
      const thresholds = []
      for (let i = 0; i < 3; i++) {
        thresholds.push(parseInt(document.getElementById(`threshold${i}`).value))
      }
      console.log(thresholds)
      if (mode.startsWith('bwr')) {
        ditheringCanvasByPalette(canvas, bwrPalette, mode);
      } else if (mode.startsWith('somegray')) {
        dithering(ctx, canvas.width, canvas.height, thresholds, mode);
      } else {
        dithering(ctx, canvas.width, canvas.height, thresholds, mode);
      }
    }

  <script>
    const TODO_STORAGE_KEY = 'etag_todo_items';
    // const TODO_CANVAS_WIDTH = 296;
    // const TODO_CANVAS_HEIGHT = 128;

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getTodoItems() {
      try {
        const saved = localStorage.getItem(TODO_STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch (error) {
        console.warn('读取待办事项失败', error);
        return [];
      }
    }

    function saveTodoItems(items) {
      try {
        localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(items));
      } catch (error) {
        console.warn('保存待办事项失败', error);
      }
    }

    function renderTodoListUI() {
      const list = document.getElementById('todo-list');
      const items = getTodoItems();
      list.innerHTML = '';

      if (!items.length) {
        const emptyItem = document.createElement('li');
        emptyItem.textContent = '暂无待办事项';
        emptyItem.style.color = '#888';
        list.appendChild(emptyItem);
        return;
      }

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.style.margin = '4px 0';
        li.innerHTML = `
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTodoItem(${index})">
            <span style="${item.done ? 'text-decoration: line-through; color:#666;' : ''}">${escapeHtml(item.text)}</span>
          </label>
        `;
        list.appendChild(li);
      });
    }

    function addTodoItem() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) {
        alert('请输入待办事项');
        return;
      }

      const items = getTodoItems();
      items.push({ text, done: false });
      saveTodoItems(items);
      input.value = '';
      renderTodoListUI();
      renderTodoListToCanvas();
    }

    function toggleTodoItem(index) {
      const items = getTodoItems();
      if (!items[index]) return;
      items[index].done = !items[index].done;
      saveTodoItems(items);
      renderTodoListUI();
      renderTodoListToCanvas();
    }

    function clearTodoItems() {
      saveTodoItems([]);
      renderTodoListUI();
      renderTodoListToCanvas();
    }

    function wrapTodoText(ctx, text, maxWidth) {
      const words = text.split(/\s+/);
      const lines = [];
      let current = '';

      words.forEach((word) => {
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });

      if (current) {
        lines.push(current);
      }

      return lines.length ? lines : [''];
    }

function renderTodoListToCanvas() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  // 读取当前选中屏幕对应的画布真实尺寸，不再固定
  const cw = canvas.width;
  const ch = canvas.height;

  // 清空画布，使用真实宽高
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, cw, ch);

  // 标题
  ctx.fillStyle = 'black';
  ctx.font = 'bold 20px 黑体';
  ctx.fillText('待办事项', 24, 34);
 // ========== 新增：绘制当前日期 ==========
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  ctx.font = '14px 黑体';
  ctx.fillStyle = '#666';
  // 标题右侧留出间距
  ctx.fillText(dateStr, 120, 34);
  // ======================================
  // 边框适配当前画布宽高
  ctx.strokeStyle = '#999';
  const padding = 18;
  ctx.strokeRect(padding, 46, cw - padding * 2, ch - 64);

  const items = getTodoItems();
  if (!items.length) {
    ctx.font = '16px 黑体';
    ctx.fillStyle = '#888';
    ctx.fillText('暂无待办事项', padding + 16, 90);
    return;
  }

  const startY = 82;
  const lineHeight = 24;
  // 文字最大宽度跟随画布自适应
  const maxTextWidth = cw - padding * 2 - 60;

  items.forEach((item, index) => {
    const y = startY + index * lineHeight * 1.2;
    if (y > ch - 40) return;

    ctx.fillStyle = item.done ? 'red' : 'black';
    ctx.fillRect(padding + 16, y - 12, 14, 14);
    if (item.done) {
      ctx.fillStyle = 'black';
      ctx.fillText('✓', padding + 16, y);
    }

    const lines = wrapTodoText(ctx, item.text, maxTextWidth);
    ctx.fillStyle = item.done ? 'red' : 'black';
    ctx.font = '16px 黑体';
    lines.slice(0, 3).forEach((line, lineIndex) => {
      ctx.fillText(line, padding + 38, y + lineIndex * 18);
    });
    if (lines.length > 3) {
      ctx.fillStyle = 'black';
      ctx.fillText('…', padding + 38, y + 3 * 18);
    }
  });
}

  const index = parseInt(document.getElementById("classIndex").value);
  if(!text){
    alert("请输入课程名称");
    return;
  }
  if(isNaN(index) || index<1 || index>12){
    alert("节次范围1~12");
    return;
  }
  const allData = getScheduleData();
  selectedWeeks.forEach(wIdx=>{
    const weekArr = allData[wIdx];
    const exist = weekArr.findIndex(c=>c.index === index);
    if(exist >=0){
      weekArr[exist].text = text;
    }else{
      weekArr.push({index, text});
    }
  })
  saveScheduleData(allData);
  document.getElementById("classInput").value = "";
  renderScheduleUI();
  renderScheduleToCanvas();
}

// 删除指定星期、指定序号课程
function delClassItem(weekIdx, itemIdx) {
  const allData = getScheduleData();
  allData[weekIdx].splice(itemIdx,1);
  saveScheduleData(allData);
  renderScheduleUI();
  renderScheduleToCanvas();
}

// 清空全部星期课程
function clearAllSchedule() {
  if(!confirm("确定清空整周所有课程？")) return;
  const empty = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  saveScheduleData(empty);
  renderScheduleUI();
  renderScheduleToCanvas();
}

// 渲染整周课程表到Canvas（自适应画布尺寸）
function renderScheduleToCanvas() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const cw = canvas.width;
  const ch = canvas.height;
  const allData = getScheduleData();
  // 白底清空
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,cw,ch);
  // 大标题
  ctx.fillStyle = "#000";
  ctx.font = "bold 22px 黑体";
  ctx.fillText("一周课程表", 20, 36);

  // 表格基础参数
  const pad = 12;
  const tableTop = 52;
  const rowH = 28;
  const colCount = 8; // 节次 + 周一到周日
  const colW = (cw - pad*2) / colCount;
  const maxPeriod = Math.min(12, Math.floor((ch - tableTop - pad)/rowH));

  // ========== 绘制表头：节次 | 周一 周二 周三 周四 周五 周六 周日 ==========
  ctx.fillStyle = "#eee";
  ctx.fillRect(pad, tableTop, colW, rowH);
  for(let w=0;w<7;w++){
    ctx.fillRect(pad + colW*(w+1), tableTop, colW, rowH);
  }
  // 表头边框
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;
  for(let i=0;i<colCount;i++){
    ctx.strokeRect(pad + colW*i, tableTop, colW, rowH);
  }
  // 表头文字
  ctx.fillStyle = "#000";
  ctx.font = "bold 14px 黑体";
  ctx.fillText("节次", pad+6, tableTop+20);
  for(let w=0;w<7;w++){
    ctx.fillText(WEEK_NAMES[w], pad + colW*(w+1)+6, tableTop+20);
  }

  // ========== 逐行绘制1~maxPeriod节次 ==========
  ctx.font = "12px 黑体";
  for(let p=0;p<maxPeriod;p++){
    const y = tableTop + rowH*(p+1);
    const periodNum = p+1;
    // 绘制整行单元格边框
    for(let i=0;i<colCount;i++){
      ctx.strokeRect(pad + colW*i, y, colW, rowH);
    }
    // 第一列：节次数字
    ctx.fillText(periodNum.toString(), pad+10, y+18);
    // 周一到周日填充课程
    for(let w=0;w<7;w++){
      const course = allData[w].find(c=>c.index === periodNum);
      const cellX = pad + colW*(w+1) + 6;
      if(course){
        const lines = wrapTodoText(ctx, course.text, colW - 12);
        lines.slice(0,2).forEach((line,li)=>{
          ctx.fillText(line, cellX, y + 16 + li*14);
        })
      }
    }
  }
}

        if (image_mode.value === 'font') {

        }
      }

      canvas.onmousedown = function (e) {
        let ele = get_position(canvas, e.clientX, e.clientY)
        let { x, y } = ele

        switch (image_mode.value) {
          case 'paint':
            is_allow_drawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
            break;
          case 'font':
            editor.style.display = 'block';
            editor.style.left = `${e.clientX}px`;
            editor.style.top = `${e.clientY}px`;
            editor.style.fontSize = `${paint_size.value * 10}px`;
            editor.style.color = paint_color.value;
            editor.style.fontFamily = font.value;
            editor.style.fontWeight = 'bold';
            break;
          default:
            break;
        }
      };

      canvas.onmousemove = (e) => {
        let ele = get_position(canvas, e.clientX, e.clientY)
        let { x, y } = ele;
        switch (image_mode.value) {
          case 'paint':
            if (is_allow_drawing) {
              ctx.lineWidth = paint_size.value;
              ctx.strokeStyle = paint_color.value;
              ctx.lineTo(x, y);
              ctx.stroke();
            }
            break;
          case 'font':
            break;
          default:
            break;
        }
      }

      canvas.onmouseup = function () {
        switch (image_mode.value) {
          case 'paint':
            is_allow_drawing = false;
            break;
          case 'font':
            editor.focus();
            is_allow_move_editor = false;
            break;
          default:
            break;
        }
      }

      canvas.onmouseleave = function () {
        if (image_mode.value === 'paint') {
          is_allow_drawing = false;
        }
      }
    }
